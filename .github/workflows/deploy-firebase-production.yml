name: Deploy Firebase Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Approved immutable release tag
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reemove_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --global firebase-tools
      - name: Verify signed tag
        working-directory: .
        run: git tag -v "${{ inputs.release_tag }}"
      - name: Materialize Firebase project aliases
        env:
          FIREBASE_PRODUCTION_PROJECT_ID: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
        run: |
          if [[ -z "${FIREBASE_PRODUCTION_PROJECT_ID}" ]]; then
            echo "Set GitHub Environment variable FIREBASE_PRODUCTION_PROJECT_ID on production." >&2
            exit 1
          fi
          printf '%s\n' "{
            \"projects\": {
              \"production\": \"${FIREBASE_PRODUCTION_PROJECT_ID}\"
            },
            \"default\": \"production\"
          }" > .firebaserc
      - name: Deploy approved backend
        run: ./scripts/firebase/deploy_production.sh
        env:
          RELEASE_APPROVED: "true"
          GITHUB_REF_TYPE: tag
      - name: Smoke checks
        if: ${{ vars.PUBLIC_STATUS_BASE_URL != '' }}
        run: ./scripts/firebase/post_deploy_smoke.sh
        env:
          PUBLIC_STATUS_BASE_URL: ${{ vars.PUBLIC_STATUS_BASE_URL }}
