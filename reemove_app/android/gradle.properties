# Keep JVM heap bounded so local builds can run on smaller disks/RAM.
# Owner may raise for large CI runners if needed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Flutter 3.44 / AGP transition: keep legacy Kotlin Gradle Plugin + DSL until
# plugins (including FlutterFire) fully migrate to AGP 9 built-in Kotlin / new DSL.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.newDsl=false
android.builtInKotlin=false
