name: reemove
version: 0.1.0+1
publish_to: "none"
description: ReeMove - a production-grade AI-powered sports social network.

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_analytics: ^12.4.4
  firebase_app_check: ^0.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_storage: ^13.4.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
