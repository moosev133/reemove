name: reemove
version: 0.1.0+1
publish_to: "none"
description: ReeMove - a production-grade AI-powered sports social network.

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  connectivity_plus: ^7.2.0
  firebase_analytics: ^12.4.4
  firebase_app_check: ^0.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.6
  firebase_database: ^12.4.1
  firebase_messaging: ^16.4.2
  firebase_performance: ^0.11.4+5
  firebase_remote_config: ^6.5.1
  firebase_storage: ^13.4.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_maps_flutter: ^2.17.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
