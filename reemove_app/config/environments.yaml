schema_version: 1
project: ReeMove
environments:
  development:
    firebase_alias: development
    data_classification: synthetic_only
    app_check: debug_provider
    analytics_collection_default: false
    deploy_source: developer_or_ci
  staging:
    firebase_alias: staging
    data_classification: synthetic_and_consented_testers
    app_check: real_provider_monitor_then_enforce
    analytics_collection_default: false
    deploy_source: protected_staging_branch
  production:
    firebase_alias: production
    data_classification: real_user_data
    app_check: real_provider_monitor_then_enforce
    analytics_collection_default: consent_and_policy_controlled
    deploy_source: signed_tag_with_protected_approval
identifiers:
  android_application_id: REPLACE_WITH_FINAL_ID
  ios_bundle_id: REPLACE_WITH_FINAL_ID
  functions_region: europe-west1
  firestore_location: REPLACE_BEFORE_PROJECT_CREATION
notes: |
  Production aliases match .firebaserc.example (development / staging / production).
  Emulator project remains demo-reemove with Firestore on port 8180.
