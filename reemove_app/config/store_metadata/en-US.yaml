full_description: |
  ReeMove is the digital home of sports lifestyle. Follow athletes and friends, share your progress, discover nearby places and activities, join challenges, connect through messages and groups, explore sports equipment, and use safety-aware AI tools for training inspiration.

  ReeMove launches with rich experiences for football, gym, and running, with an architecture designed to expand to more sports. Privacy, reporting, blocking, moderation, and account controls are built into the experience.

  Some features depend on location, notification, camera, or photo permissions. You stay in control and can change permissions in your device settings.
