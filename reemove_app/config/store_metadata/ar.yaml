full_description: |
  ReeMove هو البيت الرقمي لأسلوب الحياة الرياضي. تابع الرياضيين والأصدقاء، شارك تقدمك، اكتشف الأماكن والأنشطة القريبة، انضم إلى التحديات، تواصل عبر الرسائل والمجموعات، استكشف المعدات الرياضية، واستخدم أدوات ذكاء اصطناعي تراعي السلامة للحصول على أفكار تدريبية.

  يبدأ ReeMove بتجارب متكاملة لكرة القدم والنادي الرياضي والجري، مع بنية قابلة للتوسع إلى رياضات إضافية. تتضمن التجربة إعدادات الخصوصية والإبلاغ والحظر والإشراف وحذف الحساب.

  تعتمد بعض الميزات على أذونات الموقع أو الإشعارات أو الكاميرا أو الصور. يمكنك التحكم بهذه الأذونات وتغييرها من إعدادات جهازك.
